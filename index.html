<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrijvenmarkt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
    <script src="./js/core.js" defer></script>
</head>

<body>
    <main>
        <!-- Hero -->
        <section class="hero container-fluid">
            <div class="container text-start">
                <h1 class="fw-bold text-uppercase">Bedrijvenmarkt ervaring</h1>
                <p>Scroll om te ontdekken</p>
            </div>
        </section>
        
        <!-- Horizontal companies section -->
        <section class="horizontal-section" data-direction="right">
            <div class="horizontal-track">
                <div class="panel">
                    <h2 class="display-3">01 — Company</h2>
                </div>
                
                <div class="panel">
                    <h2 class="display-3">02 — Company</h2>
                </div>

                <div class="panel">
                    <h2 class="display-3">03 — Company</h2>
                </div>
            </div>
        </section>
        
        <section class="about container-fluid">
            <div class="container">
                <h2>Eén bedrijf onder de loep</h2>
            </div>
        </section>
        
        <!-- Horizontal section in the opposite direction -->
        <section class="horizontal-section" data-direction="left">
            <div class="horizontal-track">
                <div class="panel panel-three">
                    <h2 class="display-3">03 — Slide</h2>
                </div>
                
                <div class="panel">
                    <h2 class="display-3">02 — Slide</h2>
                </div>
                
                <div class="panel">
                    <h2 class="display-3">01 — Slide</h2>
                </div>
            </div>
        </section>
        
        <!-- Footer -->
        <section class="footer container-fluid">
            <div class="container">
                <h2>That's all. For now.</h2>
            </div>
        </section>
    </main>
</body>
</html>
